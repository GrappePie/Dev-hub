<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRID · Objetos generados</title><style>body{background:#172d3c;color:#f6e9cb;font:14px monospace;padding:20px;margin:0}h1{font-size:22px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}section{min-width:0}canvas{width:100%;image-rendering:pixelated;background:#85abb5}h2{font-size:14px}a{color:#fff}button{font:inherit;padding:8px}header{margin-bottom:20px}</style><header><h1>GRID / OBJETOS GENERADOS</h1><p>Vegetación, tráfico, nubes, panoramas y oleaje.</p><button id="pause">PAUSAR</button> <a href="/scripts/outrun-preview.html">VOLVER A LA CARRETERA</a></header><main></main><script type="module">
import {drawArt,drawOcean,warmArcadeArt} from '/src/components/backgrounds/arcade/art.ts';
const groups=[['nature',['PALMERA','PINO','ÁRBOL FRONDOSO','CACTUS','ARBUSTO EN FLOR','ROCAS','FLORES Y HIERBA','CASETA DE PLAYA']],['traffic',['COUPÉ','COMPACTO','CAMPER','CAMIÓN','MOTO','MINIBÚS']],['scenery',['NUBES 1','NUBES 2','NUBES 3','COSTA E ISLAS','MESAS DEL DESIERTO','MONTAÑAS DEL BOSQUE']]];
const views=[];for(const [set,names] of groups)for(let i=0;i<names.length;i++){const section=document.createElement('section'),label=document.createElement('h2'),canvas=document.createElement('canvas');label.textContent=names[i];canvas.width=320;canvas.height=280;section.append(label,canvas);document.querySelector('main').append(section);views.push({ctx:canvas.getContext('2d'),set,index:i})}
const water=document.createElement('section');water.innerHTML='<h2>AGUA ANIMADA</h2><canvas width="320" height="280"></canvas>';document.querySelector('main').append(water);const ocean=water.querySelector('canvas').getContext('2d');let t=0,last=0,paused=false;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'REANUDAR':'PAUSAR'};
function frame(now){if(now-last<1000/30){requestAnimationFrame(frame);return}const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(!paused)t+=dt;warmArcadeArt();for(const {ctx,set,index} of views){ctx.clearRect(0,0,320,280);drawArt(ctx,set,index,160,260,{height:set==='scenery'?130:230,width:set==='scenery'?300:undefined,wind:set==='nature'&&index<3?Math.sin(t*1.3):0})}drawOcean(ocean,320,280,t);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
