<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRID · Ruta arcade</title>
<style>body{margin:0;padding:24px;background:#131b2b;color:#f7eddb;font:14px monospace}h1{font-size:22px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}canvas{width:100%;image-rendering:pixelated;border:3px solid #687b8d;box-sizing:border-box}button,a{background:#26394f;color:#fff;padding:10px 16px;border:1px solid #7b90a0;font:inherit;cursor:pointer}nav{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}p{color:#b9c9d8}.mobile{max-width:390px;margin-top:24px}</style>
<h1>GRID / RUTA ARCADE</h1><p>Playa → desierto → bosque · carretera y escenarios procedurales · convertible y personajes generados · pelo animado</p><nav><button id="pause">PAUSAR</button><button id="speed">VELOCIDAD ×1</button><button id="traffic">VER ADELANTAMIENTO</button><button id="dust">VER CURVA CON POLVO</button><button id="hill">VER CRESTA</button><button id="dip">VER BAJADA</button><a href="/scripts/convertible-preview.html">VER PERSONAJES Y VIENTO</a><a href="/scripts/environment-preview.html">VER OBJETOS</a><a href="/">REPRODUCTOR</a></nav><main></main><section class="mobile"><h2>FORMATO VERTICAL</h2><canvas id="mobile" width="390" height="700"></canvas></section>
<script type="module">
import {drawArcadeGrid} from '/src/components/backgrounds/arcade/scene.ts';
const palette={primary:'45 100% 55%',accent:'140 60% 40%',dark:'240 25% 14%',border:'45 60% 45%',danger:'0 80% 55%'};
const names=['PLAYA','DESIERTO','BOSQUE'];
const scenes=names.map((name,i)=>{const section=document.createElement('section'),title=document.createElement('h2'),canvas=document.createElement('canvas');title.textContent=name;canvas.width=640;canvas.height=400;section.append(title,canvas);document.querySelector('main').append(section);return {ctx:canvas.getContext('2d'),offset:i*13,title}});
const mobile=document.querySelector('#mobile').getContext('2d');let time=0,last=0,paused=false,speed=1;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'REANUDAR':'PAUSAR'};document.querySelector('#speed').onclick=e=>{speed=speed===1?4:1;e.target.textContent='VELOCIDAD ×'+speed};
document.querySelector('#traffic').onclick=()=>{time=2.9;paused=true;document.querySelector('#pause').textContent='REANUDAR'};
document.querySelector('#hill').onclick=()=>{time=0;paused=true;document.querySelector('#pause').textContent='REANUDAR'};
document.querySelector('#dip').onclick=()=>{time=20;paused=true;document.querySelector('#pause').textContent='REANUDAR'};
document.querySelector('#dust').onclick=()=>{time=5;paused=true;document.querySelector('#pause').textContent='REANUDAR'};
function frame(now){if(now-last<1000/30){requestAnimationFrame(frame);return}const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(!paused)time+=dt*speed;scenes.forEach(({ctx,offset,title})=>{const travel=offset+time*.3,part=travel/13,index=Math.floor(part)%3,phase=part%1;title.textContent=names[index]+(phase>.8?' → '+names[(index+1)%3]:'');drawArcadeGrid(ctx,640,400,time,.3,.6,true,palette,travel)});drawArcadeGrid(mobile,390,700,time,.3,.6,true,palette,time*.3);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
