<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convertible · viento y dirección</title><style>body{background:#1b3347;color:#f8e5c4;font:15px monospace;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:16px}canvas{width:100%;image-rendering:pixelated;background:#87b7c7}h1{font-size:22px}a{color:#fff}img{max-width:100%;image-rendering:pixelated}button{font:inherit;padding:10px}</style><h1>CONVERTIBLE / DIRECCIÓN Y VIENTO</h1><p>Arte generado: dos ocupantes, pelo al viento en ocho cuadros, sin deformar el carro. Izquierda · centro · derecha.</p><button id="pause">PAUSAR</button> <button id="body">SOLO CARRO</button> <button id="hair">OCULTAR PELO</button> <a href="/scripts/outrun-preview.html">VOLVER A LA CARRETERA</a><main></main><h2>CAPAS INDEPENDIENTES</h2><img src="/src/assets/arcade-convertible-body-v2.png" alt="Carro vacío"><img src="/src/assets/arcade-convertible-occupants-v2.png" alt="Conductor y pasajera"><img src="/src/assets/arcade-convertible-hair-v3.png" alt="Pelo independiente en ocho estados">
<script type="module">import {drawConvertible} from '/src/components/backgrounds/arcade/convertible.ts';let t=0,last=0,paused=false,bodyOnly=false,showHair=true;const views=[-.08,0,.08].map((steer)=>{const c=document.createElement('canvas');c.width=512;c.height=380;document.querySelector('main').append(c);return {c,ctx:c.getContext('2d'),steer}});document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'REANUDAR':'PAUSAR'};document.querySelector('#body').onclick=e=>{bodyOnly=!bodyOnly;e.target.textContent=bodyOnly?'MOSTRAR PERSONAJES':'SOLO CARRO'};document.querySelector('#hair').onclick=e=>{showHair=!showHair;e.target.textContent=showHair?'OCULTAR PELO':'MOSTRAR PELO'};function frame(now){if(last&&!paused)t+=Math.min(.05,(now-last)/1000);last=now;for(const {ctx,steer} of views){ctx.clearRect(0,0,512,380);drawConvertible(ctx,256,340,440,steer,t,true,{people:!bodyOnly,hair:showHair})}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
